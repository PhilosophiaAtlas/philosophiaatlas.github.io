name: Build and deploy wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/wiki/philosophy/index.html && test -f dist/pagefind/pagefind.js && test -f dist/preview/philosophy.json && test -f dist/special/random/index.html
      - run: node -e 'const x=JSON.parse(require("fs").readFileSync("dist/preview/philosophy.json","utf8")); if(!x.title||!x.summary) process.exit(1)'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
